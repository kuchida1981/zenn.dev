name: "新規記事の作成"
description: "新しいZenn記事の下書きPRを作成します"
title: "[記事のタイトルを入力してください]"
body:
  - type: dropdown
    id: type
    attributes:
      label: "記事のタイプ"
      description: "技術記事 (tech) または アイデア記事 (idea)"
      options:
        - "tech"
        - "idea"
    validations:
      required: true
  - type: input
    id: emoji
    attributes:
      label: "アイキャッチ絵文字"
      description: "アイキャッチとして使われる絵文字（1文字）"
      placeholder: "📝"
    validations:
      required: true
